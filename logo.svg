<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="g2" x1="20" y1="4" x2="20" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="20" cy="20" r="17" stroke="url(#g1)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <!-- middle ring -->
  <circle cx="20" cy="20" r="12" stroke="url(#g2)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- core brain/neuron shape -->
  <circle cx="20" cy="20" r="7" fill="url(#g1)" opacity="0.9"/>
  <!-- neuron connections -->
  <line x1="13" y1="13" x2="17" y2="17" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <line x1="27" y1="13" x2="23" y2="17" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
  <line x1="13" y1="27" x2="17" y2="23" stroke="#4f8cff" stroke-width="1.2" opacity="0.6"/>
  <line x1="27" y1="27" x2="23" y2="23" stroke="#4f8cff" stroke-width="1.2" opacity="0.6"/>
  <line x1="20" y1="5" x2="20" y2="13" stroke="#7c5cff" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="27" x2="20" y2="35" stroke="#7c5cff" stroke-width="1" opacity="0.5"/>
  <line x1="5" y1="20" x2="13" y2="20" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <line x1="27" y1="20" x2="35" y2="20" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <!-- neuron nodes at endpoints -->
  <circle cx="13" cy="13" r="2" fill="#7c5cff" opacity="0.7"/>
  <circle cx="27" cy="13" r="2" fill="#22d3ee" opacity="0.7"/>
  <circle cx="13" cy="27" r="2" fill="#4f8cff" opacity="0.7"/>
  <circle cx="27" cy="27" r="2" fill="#7c5cff" opacity="0.7"/>
  <circle cx="20" cy="5" r="1.5" fill="#7c5cff" opacity="0.5"/>
  <circle cx="20" cy="35" r="1.5" fill="#7c5cff" opacity="0.5"/>
  <circle cx="5" cy="20" r="1.5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="35" cy="20" r="1.5" fill="#22d3ee" opacity="0.5"/>
  <!-- core highlight -->
  <circle cx="19" cy="19" r="3" fill="#fff" opacity="0.35"/>
</svg>
